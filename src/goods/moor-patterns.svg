<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Moor pattern pack, twelve tiles">
  <rect width="1200" height="900" fill="#f4f1ea"/>
  <text x="60" y="70" font-size="32" font-weight="700" fill="#33393f" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">MOOR · 12 SEAMLESS TILES</text>
  <defs>
    <pattern id="heather" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#6b5a86"/>
      <circle cx="15" cy="15" r="7" fill="#8f7bb0"/><circle cx="45" cy="45" r="7" fill="#8f7bb0"/>
      <circle cx="45" cy="15" r="4" fill="#4a3d63"/><circle cx="15" cy="45" r="4" fill="#4a3d63"/>
    </pattern>
    <pattern id="grit" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7d746a"/>
      <rect x="4" y="4" width="12" height="12" rx="3" fill="#948a7e"/>
      <rect x="24" y="20" width="10" height="10" rx="3" fill="#5f574f"/>
    </pattern>
    <pattern id="peat" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#3e4a45"/>
      <path d="M0 25 Q12 15 25 25 T50 25" stroke="#5a6b63" stroke-width="4" fill="none"/>
      <path d="M0 45 Q12 35 25 45 T50 45" stroke="#2c3531" stroke-width="4" fill="none"/>
    </pattern>
    <pattern id="path" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#8a9161"/>
      <ellipse cx="35" cy="35" rx="14" ry="22" fill="#a89d7e"/>
      <circle cx="12" cy="12" r="5" fill="#6d734a"/><circle cx="58" cy="58" r="5" fill="#6d734a"/>
    </pattern>
  </defs>
  <g>
    <rect x="60" y="110" width="255" height="255" fill="url(#heather)" stroke="#33393f"/>
    <rect x="330" y="110" width="255" height="255" fill="url(#grit)" stroke="#33393f"/>
    <rect x="600" y="110" width="255" height="255" fill="url(#peat)" stroke="#33393f"/>
    <rect x="870" y="110" width="255" height="255" fill="url(#path)" stroke="#33393f"/>
    <rect x="60" y="380" width="255" height="255" fill="url(#grit)" stroke="#33393f"/>
    <rect x="330" y="380" width="255" height="255" fill="url(#peat)" stroke="#33393f"/>
    <rect x="600" y="380" width="255" height="255" fill="url(#path)" stroke="#33393f"/>
    <rect x="870" y="380" width="255" height="255" fill="url(#heather)" stroke="#33393f"/>
    <rect x="60" y="650" width="525" height="200" fill="url(#peat)" stroke="#33393f"/>
    <rect x="600" y="650" width="525" height="200" fill="url(#heather)" stroke="#33393f"/>
  </g>
  <text x="60" y="890" font-size="16" fill="#33393f" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Each tile repeats seamlessly. Use in client work freely; do not resell the tiles. ACME Digital Goods</text>
</svg>
